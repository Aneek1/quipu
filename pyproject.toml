[project]
name = "quipu"
version = "0.1.0"
description = "A small language model trained from scratch"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.9.1",
    "numpy>=2.1",
    "tiktoken>=0.8",
    "datasets>=3.0",
    "tqdm>=4.66",
    "safetensors>=0.8.0",
    "transformers>=5.17.0",
    "flask>=3.1.3",
    "pyflakes>=4.0.0",
    "tokenizers>=0.23.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quipu", "stepbuild"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
