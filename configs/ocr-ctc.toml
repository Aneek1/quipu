# Quipu-OCR encoder stage (spec section 5.1). Defaults suit a Kaggle T4.
[model]
d_model = 384
n_layer = 12
n_head  = 6
mlp     = 1536

[data]
text      = "data/ocr/text/train.txt"
fonts     = "data/ocr/fonts"
eval_dir  = "data/ocr/eval"
hand_frac = 0.3
max_chars = 36            # ~35 characters fit 64x1024; eval_ocr.MAX_CHARS matches
workers   = 4             # Kaggle has 4 vCPUs

[train]
steps        = 60000
batch        = 128
lr           = 1e-3
warmup       = 1000
weight_decay = 0.05
eval_every   = 2000
eval_n       = 500        # test-set lines logged per eval (monitoring; eval_ocr run scores all)
val_n        = 0          # val lines per eval, 0 = all (eval_ocr make --n-val, 500)
patience     = 2          # evaluations without a better val CER before stopping
precision    = "fp16"     # "fp16" (T4) | "bf16" (compute capability 8.0+) | "fp32"
seed         = 0
ckpt_dir     = "runs/ocr-ctc"
