# ------------------------------------------------------------------ nine languages
# Weights: 3 each = 1/9 of the slice per language; Urdu's 3 split 2 (romanized, as v2)
# + 1 (native script, owner 14 Oct). Language ID (the owner's specialist, as v2) drops
# a document whose top label is another language; cmn_Hani keeps either Chinese script.
# skip_rows: the rows data v2 already read from the start of each subset
# (data/shards-moe/manifest.json, text.by_language.*.rows_scanned). hin_Latn and
# urd_Latn were read whole by v2 and are tiny: they start again from row 0 and will
# hit the 4-epoch limit first.
[defaults.fineweb2]
kind        = "hf_parquet"
slice       = "languages"
repo        = "HuggingFaceFW/fineweb-2"
revision    = "af9c13333eb981300149d5ca60a8e9d659b276b9"
text_field  = "text"
meta_fields = ["id", "url"]
licence     = "ODC-By 1.0 (and the Common Crawl terms of use)"

[sources.fw2-ind_Latn]
defaults  = "fineweb2"
weight    = 3
files     = ["data/ind_Latn/train/*.parquet"]
lid       = "ind_Latn"
skip_rows = 106510
[sources.fw2-zsm_Latn]
defaults  = "fineweb2"
weight    = 3
files     = ["data/zsm_Latn/train/*.parquet"]
lid       = "zsm_Latn"
skip_rows = 136421
[sources.fw2-cmn_Hani]
defaults  = "fineweb2"
weight    = 3
files     = ["data/cmn_Hani/train/*.parquet"]
lid       = "cmn_Hani"
skip_rows = 230932
[sources.fw2-jpn_Jpan]
defaults  = "fineweb2"
weight    = 3
files     = ["data/jpn_Jpan/train/*.parquet"]
lid       = "jpn_Jpan"
skip_rows = 102732
[sources.fw2-kor_Hang]
defaults  = "fineweb2"
weight    = 3
files     = ["data/kor_Hang/train/*.parquet"]
lid       = "kor_Hang"
skip_rows = 108305
[sources.fw2-tam_Taml]
defaults  = "fineweb2"
weight    = 3
files     = ["data/tam_Taml/train/*.parquet"]
lid       = "tam_Taml"
skip_rows = 98884
[sources.fw2-hin_Deva]
defaults  = "fineweb2"
weight    = 3
files     = ["data/hin_Deva/train/*.parquet"]
lid       = "hin_Deva"
skip_rows = 170762
[sources.fw2-hin_Latn]
defaults  = "fineweb2"
weight    = 3
files     = ["data/hin_Latn/train/*.parquet"]
lid       = "hin_Latn"
[sources.fw2-urd_Latn]
defaults  = "fineweb2"
weight    = 2
files     = ["data/urd_Latn/train/*.parquet"]
lid       = "urd_Latn"
# Native-script Urdu: the LID specialist has no urd_Arab label (it was trained on
# romanized Urdu), so this subset is not language-filtered; FineWeb-2's own LID chose it.
[sources.fw2-urd_Arab]
defaults  = "fineweb2"
weight    = 1
files     = ["data/urd_Arab/train/*.parquet"]

# ------------------------------------------------------------------ verified answers
# Local, read-only. Only the "train" split: the "val" rows stay held out for the chat
# fine-tune's evaluation. Teacher Qwen/Qwen2.5-Coder-7B-Instruct (Apache-2.0); the
# builder records each row's teacher and revision.
[sources.verified-answers]
kind        = "local_jsonl"
slice       = "verified"
weight      = 1
path        = "data/distill-v2/kept"
files       = ["part-*.jsonl"]
render      = "prompt_response"
split       = "train"
meta_fields = ["id", "teacher", "revision"]
attribution_field = "teacher"
licence     = "Apache-2.0 teacher outputs (Qwen/Qwen2.5-Coder-7B-Instruct); prompts: see data/distill-v2/prompts/manifest.json"
