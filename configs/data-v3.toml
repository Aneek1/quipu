# peS2o's loading script (peS2o.py) is not run: the v2 data files it reads are plain
# gzipped JSON lines in the same repo and are streamed directly.
[sources.pes2o]
kind        = "hf_jsonl_gz"
slice       = "reference"
weight      = 1
repo        = "allenai/peS2o"
revision    = "636a503e44a3ca1b58e01fb61eab0825cd574de0"
files       = ["data/v2/train-*.json.gz"]
text_field  = "text"
meta_fields = ["id", "source"]
attribution_field = "source"
licence     = "ODC-By 1.0 (papers: their own licences, see Semantic Scholar)"

[sources.arxiv]
kind        = "hf_jsonl_gz"
slice       = "reference"
weight      = 1
repo        = "common-pile/arxiv_papers_filtered"
revision    = "033cf7f53f9b348deec868c1a5a48484f3ee9e52"
files       = ["arxiv-papers-*.json.gz"]
text_field  = "text"
