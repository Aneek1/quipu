name = "quipu-moe-a1b"

# Spec docs/superpowers/specs/2026-10-14-quipu-moe-a1b-design.md: the next, bigger
# quipu-moe for a one-week trial on a DGX B200 (8x B200, 178 GiB each). ~5.0B total /
# ~1.0B active (5,040.3M / 1,026.4M, counted by tests/test_config_a1b.py on the meta
# device). Same architecture and A/B winners as configs/quipu-moe.toml (Muon,
# SwiGLU, plain residual); only the sizes, the dispatch and the schedule change.
#
# Data parallel (quipu/dist.py) keeps a FULL replica on every GPU: fp32 weights,
# fp32 grads, Muon momentum and the bf16 casts are ~66.7 GiB, activations at
# micro_batch 8 ~62.6 GiB, ~129 GiB projected per GPU of 178 (spec, "Memory").
# Total parameters, not active ones, are what that budget caps.

[model]
kind       = "moe"
vocab_size = 49152     # artifacts/tokenizer-v3/tokenizer.json, retrained with urd_Arab (spec, "Vocabulary")
d_model    = 2048
n_layer    = 22
n_head     = 16        # head_dim 128
n_kv_head  = 4
ffn_hidden = 2048      # unused by kind "moe"; the feed-forward is the expert layout below
context    = 2048
rope_base  = 10000.0
norm_eps   = 1e-6
# Finer experts than quipu-moe (expert_hidden d/4, not d/2) and top-6: the active
# routed width is 6 x 512 = 1.5 d, plus the shared expert's d. 64 experts, not 128:
# 128 x 512 at this depth is ~9.5B total, which does not fit a replica (spec).
n_experts      = 64
top_k          = 6
expert_hidden  = 512
shared_experts = 1
shared_hidden  = 2048
activation     = "swiglu"   # A/B 3 kept SwiGLU (remote-runs/quipu-moe run_config)
situ_beta_gate = 4.0
situ_beta_up   = 25.0
attnres_blocks = 0          # A/B 2 kept the plain residual
attnres_checkpoint = false
balance_update_rate = 0.3
moe_dispatch   = "grouped"  # quipu.moe forward_grouped: 3.24x the loop on B200, no drops

[data]
# Neither path exists yet. tokenizer-v3 is the 49,152-token BPE retrained with
# Arabic-script Urdu in its sample (data v3 spec, "Urdu script and the tokenizer");
# shards-v3 is the data v3 pool tokenized with it, not with artifacts/tokenizer
# (the trainer refuses shards whose manifest names another tokenizer:
# quipu.train.check_shard_tokenizer). The vocab check runs once the file exists.
tokenizer    = "artifacts/tokenizer-v3/tokenizer.json"
shard_dir    = "data/shards-v3"
# The mix itself is the data v3 builder's (configs/data-v3.toml, written separately);
# the trainer reads only shard_dir. The fields below are what DataConfig requires,
# kept as in quipu-moe. code_share is the v3 code slices (45% starcoderdata + 5%
# github-code-clean + 3% code-related web). text_language_weights is left out, so the
# mix-weighted validation loss is off (English val only) until it is set to the
# v3 builder's final text mix.
dataset      = "HuggingFaceFW/fineweb-edu"
subset       = "sample-10BT"
shard_tokens = 100_000_000
val_tokens   = 10_000_000
code_dataset    = "codeparrot/github-code-clean"
code_share      = 0.53
code_languages  = ["Python", "JavaScript", "TypeScript", "HTML", "CSS", "SQL",
                   "PHP", "Java", "GO", "Shell", "Dockerfile", "C", "C++", "Rust"]
code_licenses   = ["mit", "apache-2.0", "bsd-2-clause", "bsd-3-clause", "isc",
                   "cc0-1.0", "unlicense"]
html_cap        = 0.08
code_max_doc_tokens = 16_000
code_val_tokens = 5_000_000
code_heldout_first_file = 840
code_files_total        = 880
lid_model    = "AneekC/lid-specialists-9plus1"
lid_revision = "117966eb565a5e3c2ee1f1ce7b56848726b56982"  # AneekC/lid-specialists-9plus1

[train]
# Sized for scenario B (8 B200 x ~150 h): 215B tokens projected at today's ~17% MFU
# and 87.5% data-parallel scaling; 160B is ~75% of that, so the cosine reaches lr_min
# inside the week even if scaling or MFU come in lower. Re-set it after the first
# hour's measured tokens/s (spec, "First hour"), before step 0's plan is written.
# 160B / 1.03B active = ~156 tokens per active parameter.
total_tokens  = 160_000_000_000 # 76,293 steps
batch_tokens  = 2_097_152       # 1,024 sequences x 2048 tokens; grad_accum 128 (16 per rank on 8)
                                # 2M, not 0.5M: every rank runs the whole Muon step (~74 TFLOP
                                # of Newton-Schulz) and a 20 GB fp32 all-reduce once per step,
                                # so a bigger step amortises them (~5% of a ~5.3 s step);
                                # DeepSeek's batch law gives ~2.2M at this compute (spec)
micro_batch   = 8              # ~129 GiB projected; 16 is ~192 GiB, over the card. Confirm
                               # the peak in the first hour; never change it after plan.json
lr            = 4e-4           # AdamW groups only (embedding/tied head, router, norms): 6e-4 x ~0.65,
                               # between the sqrt(768/2048) width scaling and DeepSeek's ~7e-4
lr_min        = 4e-5
warmup_steps  = 1000           # ~2.1B tokens, 1.3% of the run (quipu-moe: 500 x 0.5M)
weight_decay  = 0.1
beta1         = 0.9
beta2         = 0.95
grad_clip     = 1.0
seed          = 1337
ckpt_dir      = "checkpoints-moe-a1b"
ckpt_every    = 500            # ~44 min at ~5.3 s/step on 8 GPUs; each checkpoint is ~41 GB.
                               # On ONE B200 (~37 s/step) override to ~75
ckpt_keep     = 3              # ~122 GB of disk
eval_every    = 250            # ~22 min on 8 GPUs
eval_batches  = 20
# ~2%, 5%, 10%, 20%, 40%, 70% of 76,293 steps (as quipu-moe); the final step is kept too.
milestones    = [1526, 3815, 7629, 15259, 30517, 53405]
optimizer     = "muon"         # A/B 1 winner
muon_lr       = 0.02           # unchanged: Muon's spectral-norm step with the max(1, out/in)^0.5
                               # shape scale is meant to carry across width. Untested at
                               # d_model 2048: the first-hour loss curve decides (fallback 0.015)
muon_momentum = 0.95
muon_ns_steps = 5
muon_per_head = true
muon_weight_decay = 0.01
compile       = true
# A free trial: no spend backstop (budget_usd 0 = none). Set both for any paid box.
budget_usd    = 0.0
usd_per_hour  = 0.0
